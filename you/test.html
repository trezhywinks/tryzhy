<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chat Privado</title>
  <style>
    body { font-family: Arial; margin: 0; background: #f5f5f5; }
    .topbar {
      background: #4a90e2;
      color: white;
      padding: 15px;
      font-size: 18px;
    }
    #chatBox {
      padding: 10px;
      height: 70vh;
      overflow-y: auto;
      background: white;
    }
    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 60%;
      word-break: break-word;
    }
    .me { background: #daf1da; align-self: flex-end; }
    .you { background: #eee; align-self: flex-start; }
    #messageForm {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ccc;
    }
    #messageInput {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    #sendBtn {
      padding: 10px 15px;
      background: #4a90e2;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="topbar" id="chatTitle">Conversa com ...</div>
  <div id="chatBox" style="display: flex; flex-direction: column;"></div>

  <form id="messageForm">
    <input type="text" id="messageInput" placeholder="Digite uma mensagem..." autocomplete="off" />
    <button type="submit" id="sendBtn">Enviar</button>
  </form>

  <script>
    const path = window.location.pathname;
    const [user1, user2] = path.split("/tool-key/")[1].split("=");
    
    // Quem está acessando é o primeiro da URL
    const currentUser = user1;
    const otherUser = user2;

    // Mostrar "Conversa com X"
    const titleDiv = document.getElementById("chatTitle");
    titleDiv.textContent = `Conversa com ${otherUser}`;

    // WebSocket
    const socket = new WebSocket("ws://localhost:9595");

    const chatBox = document.getElementById("chatBox");
    const form = document.getElementById("messageForm");
    const input = document.getElementById("messageInput");

    // Enviar mensagem
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;

      const data = {
        from: currentUser,
        to: otherUser,
        message: msg,
        time: new Date().toISOString()
      };

      socket.send(JSON.stringify(data));
      mostrarMensagem(data, true);
      input.value = "";
    });

    // Receber mensagem
    socket.addEventListener("message", (event) => {
      const data = JSON.parse(event.data);
      if (
        (data.from === otherUser && data.to === currentUser) ||
        (data.from === currentUser && data.to === otherUser)
      ) {
        mostrarMensagem(data, data.from === currentUser);
      }
    });

    // Criar mensagem
    function mostrarMensagem(data, souEu) {
      const div = document.createElement("div");
      div.classList.add("message", souEu ? "me" : "you");
      div.textContent = `${data.from}: ${data.message}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
