<script>
const path = window.location.pathname;
    const [user1, user2] = path.split("/tool-key/")[1].split("=");

    // Quem está acessando é o primeiro da URL
    const currentUser = user1;
    const otherUser = user2;

    // Mostrar "Conversa com X"
    const titleDiv = document.getElementById("migname");
    titleDiv.textContent = `${otherUser}`;

    // WebSocket
    const socket = new WebSocket("ws://localhost:9595");

    const chatBox = document.getElementById("chatBox");
    const form = document.getElementById("messageForm");
    const input = document.getElementById("messageInput");

    // Enviar mensagem
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;

      const data = {
        from: currentUser,
        to: otherUser,
        message: msg,
        time: new Date().toISOString()
      };

      socket.send(JSON.stringify(data));
      mostrarMensagem(data, true);
      input.value = "";
    });

    // Receber mensagem
    socket.addEventListener("message", (event) => {
      const data = JSON.parse(event.data);
      if (
        (data.from === otherUser && data.to === currentUser) ||
        (data.from === currentUser && data.to === otherUser)
      ) {
        mostrarMensagem(data, data.from === currentUser);
      }
    });

    // Criar mensagem
    function mostrarMensagem(data, souEu) {
      const div = document.createElement("div");
      div.classList.add("message", souEu ? "me" : "you");
      div.textContent = `${data.from}: ${data.message}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

<script>
let currentUser = null;
const dado = localStorage.getItem('data')

async function carregarMig(dado) {
  try {
    const response = await fetch(`http://localhost:3000/k/${dado}`);
    if (!response.ok) throw new Error('Usuário não encontrado');

    const data = await response.json();
    currentUser = {
      nome: data.username,
      foto: data.image.startsWith('data:image') ? data.image : `data:image/png;base64,${data.image}`
    };

    const migmig = document.querySelector('.migimage');    const migname = document.querySelector('.migname');
    const migmigY = document.querySelector('.migimageY');    const mignameY = document.querySelector('.mignameY');

    migmig.src = currentUser.foto;
    migname.innerText = currentUser.nome;
    migmigY.src = currentUser.foto;
    mignameY.innerText = currentUser.nome;

  } catch (error) {
    console.error('Erro ao carregar dados do usuário:', error);
    alert('Erro ao carregar usuário. Comentários desativados.');
  }
}

carregarMig(dado);
</script>
