<style>
*{margin:0; padding:0; box-sizing: border-box;}

.login{ background: #1d2328; padding: 20px; padding-bottom: 30px; text-align: center; width: 370px; margin: 0 auto 10px; border-radius: 5px;}
.server{
text-align: center;} input{background: transparent; color:#fff; border:none; font-size: 20px; padding:10px;outline:none; font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;}
.input{display:flex; height: 5vh; border-radius: 5px; overflow: hidden; background: #151515; width: 90%; justify-content: space-between; margin: 0 auto 10px;}
.chat{margin-top: -10px; margin-right: 20px;} .lab{width:90%; text-align: left; margin: 0 auto 10px; display: flex; justify-content: sapce-between;} .lib{display: flex; justify-content: space-between; width: 100%;}

@media(max-width:999px){ .input{ width: 90%;}}
#pass{ width:100%;}
#lo_o{color: white;}
</style>
<body>
<div class="server">
<br>
<h4>Welcome to TryZhy</h4><br>
<div class="login">
<div class="lab"<label id="nick">Nickname</label></div>
<div class="input">
<input type="text" id="user" name="user"/>
</div>
<br>
<div class="lab">
<div class="lib">
<div class="kl_o">
<label id="lo_o">Senha</label>
</div><div class="kl_o">
<p class="cli">Ver</p></div>
</div>
</div>
<div class="input" id="ok_o">
<div class="screen">
<input type="password" name="pass" id="pass"/>
<script>
const ok_o = document.getElementById('pass');
const lo_o = document.getElementById('lo_o');
const nick = document.getElementById('nick');
const user = document.getElementById('user');

if (ok_o && lo_o) {
  ok_o.addEventListener('focus', () => {
    lo_o.style.color = '#3193e4';
  });

  ok_o.addEventListener('blur', () => {
    lo_o.style.color = 'white';
  });

}

if (nick && user) {
  user.addEventListener('focus', () => {
    nick.style.color = '#3193e4';
  });

  user.addEventListener('blur', () => {
    nick.style.color = 'white';
  });

}

</script>
</div>
<script>
document.querySelector('.cli').addEventListener('click', () => {
const pass = document.getElementById('pass');
const cli = document.querySelector('.cli');
if (pass.type === "password"){
pass.type = "text";
cli.innerText = "Esconder"
} else {
pass.type = "password";
cli.innerText = "Ver"

console.log("ta procurando oq cz?");
}
});
</script>
